# Lista ampia di testate italiane da monitorare, organizzata per categoria.
# Ogni testata ha un campo "categorie": lo scraper lo usa per filtrare quali
# testate scansionare in base al settore dell'azienda (--settore), così non
# perdi tempo a controllare testate palesemente non pertinenti.
#
# Categorie usate: generalista, finanza, sport, gossip, lifestyle, moda,
# tech, automotive, food. Una testata può averne più di una.
#
# Esempio: python scraper.py --settore automotive
# scansiona solo le testate con categoria "generalista", "automotive" o "sport".
#
# Nota sulla verifica: i domini dei quotidiani nazionali, economici, sportivi
# e dei principali settimanali sono stati verificati. Per la stampa locale ho
# incluso solo le testate di cui sono ragionevolmente certo del dominio. Se
# vuoi aggiungerne altre, dimmelo e verifico il dominio prima.

